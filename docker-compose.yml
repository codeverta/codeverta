services:
  codeverta:
    build:
      context: .
      args:
        NEXT_PUBLIC_GA_ID: "${NEXT_PUBLIC_GA_ID:?Set NEXT_PUBLIC_GA_ID in .env}"
    container_name: codeverta
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      TRAFFIC_DEBUG: ${TRAFFIC_DEBUG:-false}
    networks:
      - codeverta_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - codeverta_net

networks:
  codeverta_net:
    external: true
    name: codeverta_net
